<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>설문조사</title>
    <style>
        /* 1. 전체 배경색 및 기본 설정 */
        body {
            background-color: aliceblue;
            margin: 20px;
        }

        /* 2. 헤더 아래쪽 1픽셀 직선 테두리 */
        header {
            border-bottom: 1px solid gray;
            padding: 15px 15px 25px 15px;
            margin-bottom: 20px;
        }

        /* 3. 제목 스타일 (brown 색상, 중앙 정렬) */
        h1 {
            color: brown;
            text-align: center;
            font-family: "맑은 고딕", sans-serif;
            margin: 0 0 10px 0;
        }

        /* 4. 안내 문구 (휴먼편지체, 들여쓰기 1em) */
        p.intro {
            font-family: "휴먼편지체", sans-serif;
            font-size: 1.1em;
            text-indent: 1em;
            margin: 0;
            line-height: 1.6;
        }

        /* 5. 이미지 속 연분홍색 설문 폼 박스 영역 */
        .survey-box {
            background-color: #ffb6c1; /* 이미지의 연분홍색 배경 */
            padding: 20px;
            font-family: "휴먼편지체", sans-serif; /* 설문 항목 텍스트도 휴먼편지체 적용 */
            font-size: 1.1em;
            line-height: 2;
            color: #000;
        }

        /* 폼 내부 행 정렬 */
        .form-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            margin-right: 10px;
        }

        /* 셀렉트 박스 크기 및 스타일 */
        select {
            font-family: "맑은 고딕", sans-serif;
            padding: 3px 5px;
            font-size: 0.9em;
        }

        /* 텍스트 입력 영역 스타일 */
        .textarea-group {
            margin-top: 15px;
            padding-left: 80px; /* '남기고 싶은 말' 서체 정렬 위치 맞춤 */
        }

        textarea {
            width: 500px;
            height: 180px;
            font-family: "휴먼편지체", sans-serif;
            font-size: 1.1em;
            color: #888;
            padding: 10px;
            border: 1px solid gray;
        }

        .textarea-label {
            margin-top: 10px;
            display: block;
        }

        /* 6. 하단 주황색 둥근 모서리 푸터 */
        footer {
            background-color: orange;
            border-radius: 10px;
            padding: 12px 20px;
            margin-top: 20px;
            font-family: "휴먼편지체", sans-serif;
        }

        footer p {
            color: #333;
            font-style: italic;
            margin: 0;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <header>
        <h1>설문지</h1>
        <p class="intro">소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    </header>

    <form>
        <div class="survey-box">
            <div class="form-group">
                <label>학년</label>
                <input type="radio" name="grade" value="1" checked> 1학년
                <input type="radio" name="grade" value="2"> 2학년
                <input type="radio" name="grade" value="3"> 3학년
            </div>

            <div class="form-group">
                <label>성별</label>
                <input type="radio" name="sex" value="1" checked> 남
                <input type="radio" name="sex" value="2"> 여
            </div>

            <div class="form-group">
                <label>관심 분야</label>
                <select name="interested_field">
                    <option value="1">알고리즘</option>
                    <option value="2">통계</option>
                    <option value="3">콘텐츠 마케팅</option>
                    <option value="4">스포츠 마케팅</option>
                    <option value="5">브랜드 가치</option>
                </select>
            </div>

            <div class="form-group">
                <label>진로</label>
                <input type="checkbox" name="career" value="1" checked> 개발
                <input type="checkbox" name="career" value="2"> 기획
                <input type="checkbox" name="career" value="3"> 영업
                <input type="checkbox" name="career" value="4"> 창업
            </div>

            <div class="textarea-group">
                <textarea placeholder="글을 남겨주세요"></textarea>
            </div>
            
            <label class="textarea-label">남기고 싶은 말</label>
        </div>
    </form>

    <footer>
        <p>Copyright 2026 by MYONGJI COLLEGE</p>
    </footer>

</body>
</html>
